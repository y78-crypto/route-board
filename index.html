<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ルート調整盤 | Route Board</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12151a;
    --panel: #1a1f26;
    --panel-2: #20262e;
    --line: #2a323c;
    --text: #e9e7df;
    --text-dim: #8b93a1;
    --text-faint: #5b6472;
    --accent: #f2a65a;
    --v0: #4fd1c5;
    --v1: #f2a65a;
    --v2: #e8735c;
    --v3: #9b8cf2;
    --v4: #7ec4f2;
    --v5: #d4e26a;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .app {
    display: grid;
    grid-template-columns: 380px 1fr;
    height: 100vh;
    width: 100vw;
  }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 45vh 55vh; }
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-width: 0;
    overflow: hidden;
  }
  .brand {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--line);
  }
  .brand-eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.16em;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .brand-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand-title span { color: var(--text); }

  .toolbar {
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .btn {
    font-family: 'Inter', sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    padding: 8px 12px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { border-color: var(--text-faint); background: #262d36; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn-primary { background: var(--accent); color: #1a1206; border-color: var(--accent); font-weight: 600; }
  .btn-primary:hover { background: #f5b673; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  input[type=file] { display: none; }

  .stats {
    display: flex;
    gap: 0;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .stat { flex: 1; }
  .stat-label {
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--text-faint); margin-bottom: 4px;
  }
  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px; font-weight: 500;
  }

  .stops-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 14px 14px 24px;
  }
  .vehicle-group {
    margin-bottom: 16px;
    border-radius: var(--radius);
    background: var(--panel-2);
    border: 1px solid var(--line);
    overflow: hidden;
  }
  .vehicle-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .swatch { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .vehicle-name { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13.5px; flex: 1; }
  .vehicle-dist { font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: var(--text-dim); }

  .stop-list { list-style: none; margin: 0; padding: 6px; min-height: 12px; }
  .stop-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 8px;
    border-radius: 7px;
    margin-bottom: 3px;
    cursor: grab;
    border: 1px solid transparent;
    transition: background 0.12s;
  }
  .stop-item:hover { background: #262e38; }
  .stop-item.dragging { opacity: 0.35; }
  .stop-item.drag-over { border-top: 2px solid var(--accent); }
  .stop-order {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-faint);
    width: 16px;
    text-align: center;
    flex-shrink: 0;
  }
  .stop-body { min-width: 0; flex: 1; }
  .stop-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stop-addr { font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .drag-handle { color: var(--text-faint); font-size: 13px; flex-shrink: 0; user-select: none; }

  .empty-state {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
    padding: 40px 24px;
    color: var(--text-dim);
    gap: 14px;
  }
  .empty-state .glyph { font-size: 26px; opacity: 0.5; }
  .empty-state p { margin: 0; font-size: 13px; line-height: 1.6; max-width: 260px; }

  /* ---------- Map area ---------- */
  .map-wrap { position: relative; background: #0d1013; min-width: 0; min-height: 0;}
  #map { position: absolute; inset: 0; background: #0d1013; }
  .leaflet-container { background: #0d1013; font-family: 'Inter', sans-serif; }

  .legend {
    position: absolute; bottom: 16px; left: 16px; z-index: 500;
    background: rgba(26,31,38,0.92);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 11.5px;
    display: flex; gap: 14px; flex-wrap: wrap;
    max-width: calc(100% - 32px);
    backdrop-filter: blur(4px);
  }
  .legend-item { display: flex; align-items: center; gap: 6px; color: var(--text-dim); }

  .route-arrow {
    font-size: 13px;
    line-height: 1;
    text-shadow: 0 0 2px #0d1013, 0 0 2px #0d1013;
    pointer-events: none;
  }

  .stop-label {
    background: rgba(18,21,26,0.82);
    border: 1px solid var(--line);
    border-radius: 5px;
    padding: 1px 6px;
    font-family: 'Inter', sans-serif;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    box-shadow: none;
  }
  .stop-label::before { display: none; }
  .leaflet-tooltip.stop-label { border: 1px solid var(--line); }

  .hint-badge {
    position: absolute; top: 16px; left: 16px; z-index: 500;
    background: rgba(26,31,38,0.92);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 12px;
    font-size: 11.5px;
    color: var(--text-dim);
    backdrop-filter: blur(4px);
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-eyebrow">Dispatch / Manual Adjust</div>
      <div class="brand-title">ルート<span>調整</span>盤</div>
    </div>

    <div class="toolbar">
      <label class="btn btn-primary" for="csvInput">CSVを読み込む</label>
      <input type="file" id="csvInput" accept=".csv" />
      <button class="btn" id="sampleBtn">テストデータ</button>
      <button class="btn" id="exportCsvBtn" disabled>CSV保存</button>
      <button class="btn" id="exportImgBtn" disabled>画像保存</button>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Stops</div>
        <div class="stat-value mono" id="statStops">–</div>
      </div>
      <div class="stat">
        <div class="stat-label">Vehicles</div>
        <div class="stat-value mono" id="statVehicles">–</div>
      </div>
      <div class="stat">
        <div class="stat-label">Total km</div>
        <div class="stat-value mono" id="statTotal">–</div>
      </div>
    </div>

    <div class="stops-scroll" id="stopsScroll">
      <div class="empty-state" id="emptyState">
        <div class="glyph">◎</div>
        <p>route_result.csv を読み込むか、テストデータで試してください。ドラッグして訪問順や車両を入れ替えられます。</p>
      </div>
    </div>
  </aside>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="hint-badge" id="hintBadge" style="display:none;">左のリストをドラッグして並び替え</div>
    <div class="legend" id="legend" style="display:none;"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(function(){
  "use strict";

  const VEHICLE_COLORS = ['--v0','--v1','--v2','--v3','--v4','--v5'].map(v =>
    getComputedStyle(document.documentElement).getPropertyValue(v).trim());

  const SAMPLE_CSV =
`vehicle_id,order,name,address,latitude,longitude,cumulative_distance_km
0,0,Aさん,東京都千代田区丸の内1-1-1,35.681365,139.767125,0
0,1,Eさん,東京都台東区上野公園1-1,35.715444,139.774269,4
1,0,Aさん,東京都千代田区丸の内1-1-1,35.681365,139.767125,0
1,1,Dさん,東京都港区六本木6-10-1,35.660531,139.729400,4
1,2,Cさん,東京都渋谷区道玄坂1-2-3,35.658580,139.699820,7
1,3,Bさん,東京都新宿区西新宿2-8-1,35.689593,139.691892,11`;

  // ---- state ----
  // vehicles: [{ id, stops: [{name,address,lat,lng}] }]
  let vehicles = [];
  let map = null;
  let layerGroup = null;

  const el = (id) => document.getElementById(id);

  function bearing(a, b) {
    const toRad = d => d * Math.PI / 180, toDeg = r => r * 180 / Math.PI;
    const y = Math.sin(toRad(b.lng - a.lng)) * Math.cos(toRad(b.lat));
    const x = Math.cos(toRad(a.lat)) * Math.sin(toRad(b.lat)) -
              Math.sin(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.cos(toRad(b.lng - a.lng));
    return (toDeg(Math.atan2(y, x)) + 360) % 360;
  }

  function haversine(a, b) {
    const R = 6371;
    const dLat = (b.lat - a.lat) * Math.PI/180;
    const dLng = (b.lng - a.lng) * Math.PI/180;
    const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
  }

  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    const headers = lines[0].split(',').map(h => h.trim());
    const idx = (name) => headers.indexOf(name);
    const iV = idx('vehicle_id'), iO = idx('order'), iN = idx('name'),
          iA = idx('address'), iLat = idx('latitude'), iLng = idx('longitude');

    if (iV === -1 || iN === -1 || iLat === -1 || iLng === -1) {
      alert('CSVの列が想定と違います。vehicle_id, name, latitude, longitude 列が必要です。');
      return null;
    }

    const rows = lines.slice(1).filter(l => l.trim().length > 0).map(line => {
      // simple CSV split (no quoted commas expected in this data shape)
      const cells = line.split(',');
      return {
        vehicle_id: parseInt(cells[iV], 10),
        order: iO !== -1 ? parseInt(cells[iO], 10) : 0,
        name: cells[iN].trim(),
        address: iA !== -1 ? cells[iA].trim() : '',
        lat: parseFloat(cells[iLat]),
        lng: parseFloat(cells[iLng]),
      };
    });

    const byVehicle = {};
    rows.forEach(r => {
      if (!byVehicle[r.vehicle_id]) byVehicle[r.vehicle_id] = [];
      byVehicle[r.vehicle_id].push(r);
    });
    const vIds = Object.keys(byVehicle).map(Number).sort((a,b)=>a-b);
    return vIds.map(id => {
      const stops = byVehicle[id].sort((a,b) => a.order - b.order);
      return { id, stops: stops.map(s => ({name: s.name, address: s.address, lat: s.lat, lng: s.lng})) };
    });
  }

  function loadCSVText(text) {
    const parsed = parseCSV(text);
    if (!parsed) return;
    vehicles = parsed;
    render();
  }

  function vehicleColor(i) { return VEHICLE_COLORS[i % VEHICLE_COLORS.length]; }
  function vehicleDistance(v) {
    let d = 0;
    for (let i=0;i<v.stops.length-1;i++) d += haversine(v.stops[i], v.stops[i+1]);
    // add return leg to first stop (round trip), matches original OR-Tools model
    if (v.stops.length > 1) d += haversine(v.stops[v.stops.length-1], v.stops[0]);
    return d;
  }

  function ensureMap() {
    if (map) return;
    map = L.map('map', { zoomControl: false, attributionControl: true }).setView([35.68, 139.75], 12);
    L.control.zoom({ position: 'topright' }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      subdomains: 'abcd',
      maxZoom: 19,
      crossOrigin: true
    }).addTo(map);
    layerGroup = L.layerGroup().addTo(map);
  }

  function redrawMap() {
    ensureMap();
    layerGroup.clearLayers();
    const bounds = [];

    vehicles.forEach((v, vi) => {
      const color = vehicleColor(vi);
      const latlngs = v.stops.map(s => [s.lat, s.lng]);
      if (v.stops.length > 1) latlngs.push([v.stops[0].lat, v.stops[0].lng]); // return leg

      if (latlngs.length > 1) {
        L.polyline(latlngs, { color, weight: 2.5, opacity: 0.85, dashArray: '1 8', lineCap: 'round' }).addTo(layerGroup);
        for (let i = 0; i < latlngs.length - 1; i++) {
          const a = { lat: latlngs[i][0], lng: latlngs[i][1] };
          const b = { lat: latlngs[i+1][0], lng: latlngs[i+1][1] };
          const mid = { lat: (a.lat + b.lat) / 2, lng: (a.lng + b.lng) / 2 };
          const brg = bearing(a, b);
          L.marker([mid.lat, mid.lng], {
            icon: L.divIcon({
              className: 'route-arrow',
              html: `<div style="transform: rotate(${brg}deg); color:${color}">▲</div>`,
              iconSize: [14, 14],
              iconAnchor: [7, 7]
            }),
            interactive: false,
            keyboard: false
          }).addTo(layerGroup);
        }
      }
      v.stops.forEach((s, si) => {
        bounds.push([s.lat, s.lng]);
        const marker = L.circleMarker([s.lat, s.lng], {
          radius: si === 0 ? 7 : 6,
          fillColor: color,
          color: '#0d1013',
          weight: 2,
          fillOpacity: 1
        }).addTo(layerGroup);
        marker.bindTooltip(s.name, {
          permanent: true,
          direction: 'top',
          offset: [0,-9],
          className: 'stop-label'
        });
      });
    });

    if (bounds.length) map.fitBounds(bounds, { padding: [40,40] });
  }

  function renderLegend() {
    const legend = el('legend');
    if (!vehicles.length) { legend.style.display = 'none'; return; }
    legend.style.display = 'flex';
    legend.innerHTML = vehicles.map((v,vi) =>
      `<div class="legend-item"><span class="swatch" style="background:${vehicleColor(vi)}"></span>Vehicle ${v.id} · ${vehicleDistance(v).toFixed(1)}km</div>`
    ).join('');
  }

  function renderStats() {
    const totalStops = vehicles.reduce((a,v)=>a+v.stops.length,0);
    const total = vehicles.reduce((a,v)=>a+vehicleDistance(v),0);
    el('statStops').textContent = totalStops || '–';
    el('statVehicles').textContent = vehicles.length || '–';
    el('statTotal').textContent = vehicles.length ? total.toFixed(1) : '–';
  }

  function renderList() {
    const scroll = el('stopsScroll');
    if (!vehicles.length) {
      scroll.innerHTML = '';
      scroll.appendChild(el('emptyState') || document.createElement('div'));
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = `<div class="glyph">◎</div><p>route_result.csv を読み込むか、テストデータで試してください。ドラッグして訪問順や車両を入れ替えられます。</p>`;
      scroll.innerHTML = '';
      scroll.appendChild(empty);
      el('hintBadge').style.display = 'none';
      return;
    }
    el('hintBadge').style.display = 'block';
    scroll.innerHTML = '';

    vehicles.forEach((v, vi) => {
      const group = document.createElement('div');
      group.className = 'vehicle-group';

      const head = document.createElement('div');
      head.className = 'vehicle-head';
      head.innerHTML = `<span class="swatch" style="background:${vehicleColor(vi)}"></span>
        <span class="vehicle-name">Vehicle ${v.id}</span>
        <span class="vehicle-dist mono">${vehicleDistance(v).toFixed(1)} km</span>`;
      group.appendChild(head);

      const list = document.createElement('ul');
      list.className = 'stop-list';
      list.dataset.vehicleIndex = vi;

      v.stops.forEach((s, si) => {
        const li = document.createElement('li');
        li.className = 'stop-item';
        li.draggable = true;
        li.dataset.vehicleIndex = vi;
        li.dataset.stopIndex = si;
        li.innerHTML = `
          <span class="drag-handle">⠿</span>
          <span class="stop-order mono">${si+1}</span>
          <span class="stop-body">
            <div class="stop-name">${escapeHtml(s.name)}</div>
            <div class="stop-addr">${escapeHtml(s.address)}</div>
          </span>`;
        list.appendChild(li);
      });

      group.appendChild(list);
      scroll.appendChild(group);
    });

    attachDragHandlers();
  }

  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str || '';
    return d.innerHTML;
  }

  function render() {
    renderList();
    renderLegend();
    renderStats();
    redrawMap();
    el('exportCsvBtn').disabled = !vehicles.length;
    el('exportImgBtn').disabled = !vehicles.length;
  }

  // ---------- Drag & drop reordering (within & across vehicle lists) ----------
  let dragSrc = null;

  function attachDragHandlers() {
    const items = document.querySelectorAll('.stop-item');
    items.forEach(item => {
      item.addEventListener('dragstart', (e) => {
        dragSrc = { vi: +item.dataset.vehicleIndex, si: +item.dataset.stopIndex };
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => {
        item.classList.remove('dragging');
        document.querySelectorAll('.drag-over').forEach(n => n.classList.remove('drag-over'));
      });
      item.addEventListener('dragover', (e) => {
        e.preventDefault();
        item.classList.add('drag-over');
      });
      item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
      item.addEventListener('drop', (e) => {
        e.preventDefault();
        item.classList.remove('drag-over');
        const dst = { vi: +item.dataset.vehicleIndex, si: +item.dataset.stopIndex };
        if (!dragSrc) return;
        moveStop(dragSrc, dst);
        dragSrc = null;
      });
    });

    // also allow dropping at end of a list (empty space below items)
    document.querySelectorAll('.stop-list').forEach(list => {
      list.addEventListener('dragover', (e) => e.preventDefault());
      list.addEventListener('drop', (e) => {
        if (e.target === list && dragSrc) {
          const vi = +list.dataset.vehicleIndex;
          moveStop(dragSrc, { vi, si: vehicles[vi].stops.length - 1 });
          dragSrc = null;
        }
      });
    });
  }

  function moveStop(src, dst) {
    if (src.vi === dst.vi && src.si === dst.si) return;
    const stop = vehicles[src.vi].stops.splice(src.si, 1)[0];
    let insertAt = dst.si;
    // if we removed an earlier item from the same list, later indices shift down by 1
    if (src.vi === dst.vi && src.si < dst.si) insertAt -= 1;
    vehicles[dst.vi].stops.splice(insertAt, 0, stop);
    render();
  }

  // ---------- Export ----------
  function exportCSV() {
    const header = 'vehicle_id,order,name,address,latitude,longitude,cumulative_distance_km';
    const lines = [header];
    vehicles.forEach(v => {
      let cum = 0;
      v.stops.forEach((s, si) => {
        if (si > 0) cum += haversine(v.stops[si-1], s);
        lines.push([v.id, si, s.name, s.address, s.lat, s.lng, cum.toFixed(2)].join(','));
      });
    });
    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    downloadBlob(blob, 'route_result_edited.csv');
  }

  function exportImage() {
    const target = document.querySelector('.map-wrap');
    html2canvas(target, { backgroundColor: '#0d1013', useCORS: true }).then(canvas => {
      canvas.toBlob(blob => downloadBlob(blob, 'route_map_edited.png'));
    }).catch(err => {
      alert('画像の書き出しに失敗しました。地図タイルの読み込み待ちの可能性があります。少し待ってから再度お試しください。');
      console.error(err);
    });
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- Wire up ----------
  el('csvInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => loadCSVText(reader.result);
    reader.readAsText(file, 'UTF-8');
  });
  el('sampleBtn').addEventListener('click', () => loadCSVText(SAMPLE_CSV));
  el('exportCsvBtn').addEventListener('click', exportCSV);
  el('exportImgBtn').addEventListener('click', exportImage);

  ensureMap();
})();
</script>
</body>
</html>
